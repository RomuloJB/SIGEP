runtime: python312
entrypoint: gunicorn -b :$PORT --workers 1 --threads 4 naes2026.wsgi

# secure: always redireciona HTTP para HTTPS (RNF02)
handlers:
- url: /static
  static_dir: static_gcloud/
  secure: always
- url: /.*
  script: auto
  secure: always

automatic_scaling:
  min_instances: 0
  max_instances: 2

# Tem prioridade sobre o .env que sobe junto no deploy
env_variables:
  DEBUG: "False"
