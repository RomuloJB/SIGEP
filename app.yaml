runtime: python312
entrypoint: gunicorn -b :$PORT --workers 1 --threads 4 naes2026.wsgi

# secure: always redireciona HTTP para HTTPS (RNF02)
handlers:
- url: /static
  static_dir: static_gcloud/
  secure: always
# O cron chama esta rota direto, sem seguir o redirecionamento do secure: always.
# Ela é protegida pelo cabeçalho X-Appengine-Cron, que o App Engine tira das requisições de fora.
- url: /telegram/manutencao/
  script: auto
  secure: optional
# O Cloud Tasks entrega as tarefas da importação direto, sem seguir redirecionamento.
# A rota é protegida pelo cabeçalho X-Tarefas-Segredo.
- url: /importacao/tarefas/.*
  script: auto
  secure: optional
- url: /.*
  script: auto
  secure: always

automatic_scaling:
  min_instances: 0
  max_instances: 2

# Páginas estáticas para falhas do próprio App Engine (timeout, cota, instância fora do ar).
# Erros do Django (400/403/404/500) são tratados pelo app erros.
error_handlers:
- file: erros/paginas/erro_app_engine.html
- error_code: over_quota
  file: erros/paginas/erro_app_engine.html
- error_code: timeout
  file: erros/paginas/erro_app_engine.html

# Fora do App Engine o DEBUG vem do settings.py (True só no Windows); aqui fica explícito
env_variables:
  DEBUG: "False"
