{% extends 'usuarios/auth_base.html' %}

{% block title %}Senha redefinida{% endblock %}

{% block content %}
<div class="mb-4">
    <h1 class="auth-title h3 mb-2">Senha redefinida!</h1>
    <p class="auth-description mb-0">
        Sua senha foi alterada com sucesso. Você já pode entrar com a nova senha.
    </p>
</div>

<div class="d-grid">
    <a class="btn btn-primary" href="{% url 'login' %}">
        <i class="fas fa-sign-in-alt me-2"></i>Entrar
    </a>
</div>
{% endblock %}
