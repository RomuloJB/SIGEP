{% load static %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Cadastro | SIGEP</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <!-- FontAwesome -->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
</head>

<body class="auth-page">
    <main class="auth-viewport py-5">
        <section class="auth-panel my-auto" style="max-width: 550px; width: 100%;">
            <div class="mb-4">
                <h1 class="auth-title h3 mb-2">Criar Conta</h1>
                <p class="auth-description mb-0">
                    Preencha os campos abaixo para se cadastrar no sistema.
                </p>
            </div>

            <form method="post" novalidate>
                {% csrf_token %}
                {{ form|crispy }}

                <div class="d-grid mt-4">
                    <button class="btn btn-primary btnLoading" type="submit">
                        <i class="fas fa-user-plus me-2"></i>Registrar
                    </button>
                </div>

                <div class="divider my-4">ou</div>

                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 auth-links">
                    <a class="link-secondary text-decoration-none" href="{% url 'login' %}">
                        <i class="fas fa-sign-in-alt me-1"></i> Já tem uma conta? Entrar
                    </a>
                    <a class="link-secondary text-decoration-none" href="{% url 'index' %}">
                        Voltar para o site
                    </a>
                </div>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
