{% extends 'usuarios/auth_base.html' %}
{% load crispy_forms_tags %}

{% block title %}Esqueci minha senha{% endblock %}

{% block content %}
<div class="mb-4">
    <h1 class="auth-title h3 mb-2">Esqueci minha senha</h1>
    <p class="auth-description mb-0">
        Informe o e-mail da sua conta e enviaremos um link para você criar uma nova senha.
    </p>
</div>

<form method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}

    <div class="d-grid mt-4">
        <button class="btn btn-primary" type="submit">
            <i class="fas fa-paper-plane me-2"></i>Enviar link de redefinição
        </button>
    </div>
</form>
{% endblock %}
