<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Página estática do App Engine (error_handlers no app.yaml): sem Django, sem CDN, tudo inline -->
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box;

        main { max-width: 30rem; width: 100%; box-sizing: border-box; padding: 2.5rem 2rem; text-align: center;

        h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
        p { margin: 0 0 1.5rem; color: #66756d; line-height: 1.5; }
        a { display: inline-block; padding: .55rem 1.1rem; border-radius: .6rem; background: #198754; color: #fff;
            text-decoration: none; font-weight: 600; }

</head>
<body>
    <main>
        <h1>SIGEP está indisponível no momento</h1>
