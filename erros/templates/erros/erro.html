{% load static %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ codigo }} · {{ titulo }} - SIGEP</title>
    <link rel="icon" type="image/png" href="{% static 'assets/img/favicon-sigep.png' %}">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
    <link href="{% static 'css/sigep-ui.css' %}" rel="stylesheet">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <style>
        body { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
        .erro-card { max-width: 32rem; width: 100%; text-align: center; padding: 2.5rem 2rem; }
        .erro-icone { display: inline-grid; place-items: center; width: 4rem; height: 4rem; margin-bottom: 1rem;
                      border-radius: 1rem; background: var(--sg-primary-soft); color: var(--sg-primary); font-size: 1.6rem; }
        .erro-codigo { font-size: 3.5rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; margin: 0 0 .5rem; }
    </style>
</head>
<body>
    <main class="card erro-card">
        <div><span class="erro-icone"><i class="fas {{ icone }}"></i></span></div>
        <p class="erro-codigo">{{ codigo }}</p>
        <h1 class="h4 fw-bold">{{ titulo }}</h1>
        <p class="text-muted mb-4">{{ mensagem }}</p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
            <a class="btn btn-outline-secondary" href="javascript:history.back()"><i class="fas fa-arrow-left"></i> Voltar</a>
            <a class="btn btn-primary" href="/"><i class="fas fa-house"></i> Ir para o início</a>
        </div>
    </main>
</body>
</html>
