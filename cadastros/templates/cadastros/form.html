{% extends "website/model.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block breadcrumb %}
    <li class="breadcrumb-item active" aria-current="page">{{ titulo }}</li>
{% endblock breadcrumb %}

{% block content %}
<form action="" method="POST">
    {% csrf_token %}

    <h2>{{ title }}</h2>
    <p>Preencha todos os campos obrigátorios<p>
    
    {{ form|crispy }}

    <button type="submit" class="btn btn-success">
        Cadastrar
    </button>

</form>
{% endblock %}
