{# Selo suave do status do pedido. Uso: {% include 'cadastros/pedido-status.html' with pedido=order %} #}
<span class="{% if pedido.status == 'digitacao' %}badge-soft-neutral{% elif pedido.status == 'pendente' %}badge-soft-warning{% elif pedido.status == 'aprovado' %}badge-soft-success{% elif pedido.status == 'rejeitado' %}badge-soft-danger{% else %}badge-soft-neutral{% endif %}">{{ pedido.get_status_display }}</span>
