# CC01 (TC-22): carga nominal, 20 representantes por 10 minutos.
# Uso (na raiz do projeto, com CARGA_SENHA definida):
#   locust -f testes/carga/locustfile.py --config testes/carga/cc01.conf --host https://<homologacao>
headless = true
users = 20
spawn-rate = 2
run-time = 10m
stop-timeout = 10

# Critérios de aceitação: p95 <= 3 s em todas as rotas e menos de 1% de falhas
p95-maximo-ms = 3000
falhas-maximo = 0.01

# Relatório: tempo médio, p95, requisições/s e falhas por rota
csv = testes/carga/resultados/cc01
html = testes/carga/resultados/cc01.html
